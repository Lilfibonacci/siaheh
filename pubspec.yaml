name: siaheh
description: اپلیکیشن مدیریت هوشمند مخارج روزانه از روی پیامک‌های بانکی
publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.13.5


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  fl_chart: ^1.2.0
  shamsi_date: ^1.1.1
  intl: ^0.20.3
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  get_it: ^9.3.0
  go_router: ^18.1.0
  dartz: ^0.10.1
  lottie: ^3.6.1
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  flutter_svg: ^2.3.0
  another_telephony: ^0.4.1
  permission_handler: ^13.0.2
  liquid_glass_widgets: ^1.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0



flutter:
  uses-material-design: true

  assets:
    - assets/lottie/
    - assets/icons/banks/



  fonts:
    - family: Morabba
      fonts:
        - asset: assets/fonts/Morabba-Light.ttf
          weight: 300
        - asset: assets/fonts/Morabba-Medium.ttf
          weight: 500
        - asset: assets/fonts/Morabba-Bold.ttf
          weight: 700

